spring.application.name=epets-backend
server.port=8080

# ===== MySQL =====
# Crie o banco rodando os scripts da pasta "banco-mysql" no MySQL Workbench.
# Troque usuário e senha abaixo pelos do seu MySQL (ou defina DB_USUARIO e DB_SENHA no sistema).
spring.datasource.url=jdbc:mysql://localhost:3306/epets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" mantém os dados entre reinícios e só cria o que faltar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Endereços do front-end liberados no CORS (Vite usa 5173 por padrão)
epets.cors.origens=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Regras da loja (mesmas do site)
epets.frete.valor=12.90
epets.cupom.codigo=BEMVINDO10
epets.cupom.percentual=10